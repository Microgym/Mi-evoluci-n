<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MicroHealth 23.0 · Prueba de privacidad</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#edf5f3;color:#123e43;margin:0}main{max-width:520px;margin:auto;padding:22px}section{background:white;border:1px solid #d5e4e0;border-radius:18px;padding:20px;margin:15px 0}input,button{font:inherit;width:100%;padding:13px;border-radius:10px;margin:6px 0;border:1px solid #aac5c0}button{background:#146d65;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.45}label{display:block;margin-top:10px}small{color:#456266}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{margin-bottom:0} [hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><h1>MicroHealth 23.0</h1><p>BETA · Prueba de acceso y privacidad</p><section><strong>Solo datos ficticios.</strong> Esta página no importa datos de MicroHealth ni sustituye la aplicación actual. Las pruebas utilizan una tabla separada.</section><section id="login"><form id="form"><label>Correo electrónico<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="pass" type="password" autocomplete="current-password" required></label><button>Iniciar sesión</button></form></section><section id="panel" hidden><p id="who"></p><button id="write">Guardar marcador ficticio propio</button><button id="read">Leer registros visibles</button><button id="cross">Comprobar acceso a la otra cuenta</button><button id="files">Probar archivo privado propio</button><button id="out">Cerrar sesión</button></section><section><strong>Resultado</strong><pre id="log" aria-live="polite">Conectando…</pre></section></main><script>
const $=id=>document.getElementById(id), say=t=>$('log').textContent=t;
const URL_BASE='https://hixsuuhdryfpcvnwaqav.supabase.co';
const KEY='sb_publishable_ppvWYNAUUdwDPcH1-MIEzA_d8yfkDkj';
if(!window.supabase){say('No se ha podido cargar la biblioteca. Comprueba la conexión.');throw Error('SDK unavailable')}
const client=supabase.createClient(URL_BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'microhealth-beta-auth-v1',detectSessionInUrl:false}});
let user=null;const table='microhealth_privacy_test';
function show(session){user=session?.user||null;$('login').hidden=!!user;$('panel').hidden=!user;$('who').textContent=user?'Sesión: '+user.email:''; $('pass').value='';say(user?'Sesión iniciada. Puedes realizar las pruebas.':'Identifícate para empezar.');}
client.auth.onAuthStateChange((_event,session)=>show(session));
async function run(fn){const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await fn()}catch(e){say('Error: '+(e.message||String(e)))}finally{buttons.forEach(b=>b.disabled=false)}}
function check(r){if(r.error)throw r.error;return r.data}
$('form').onsubmit=e=>{e.preventDefault();run(async()=>{check(await client.auth.signInWithPassword({email:$('email').value,password:$('pass').value}));$('pass').value='';say('Acceso correcto.');})};
$('write').onclick=()=>run(async()=>{check(await client.from(table).upsert({user_id:user.id,marker:'Prueba ficticia '+new Date().toISOString()}));say('Marcador propio guardado.');});
$('read').onclick=()=>run(async()=>{const rows=check(await client.from(table).select('user_id,marker'));say(rows.some(r=>r.user_id!==user.id)?'FALLO: visible un registro ajeno.':`Registros visibles: ${rows.length}. Todos pertenecen a esta cuenta.\n`+rows.map(r=>r.marker).join('\n'));});
$('cross').onclick=()=>run(async()=>{const other=prompt('Pega el UID de la otra cuenta de prueba (no la contraseña).');if(!other)return;if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(other)||other===user.id)throw Error('UID ajeno no válido');const rows=check(await client.from(table).select('user_id').eq('user_id',other));const update=await client.from(table).update({marker:'Intento ficticio de modificación ajena'}).eq('user_id',other).select('user_id');const insert=await client.from(table).insert({user_id:other,marker:'Intento ficticio de inserción ajena'});say(`Lectura ajena: ${rows.length===0?'sin registros visibles':'FALLO'}\nModificación ajena: ${update.error||update.data?.length===0?'sin modificación visible':'FALLO'}\nInserción ajena: ${insert.error?'rechazada ('+insert.error.code+')':'FALLO'}\nLa lectura solo es concluyente si la otra cuenta ya guardó su marcador.`);});
$('files').onclick=()=>run(async()=>{const path=user.id+'/beta-test.txt';const bucket=client.storage.from('microhealth-private');check(await bucket.upload(path,new Blob(['Prueba ficticia MicroHealth'],{type:'text/plain'}),{upsert:true,contentType:'text/plain'}));const blob=check(await bucket.download(path));const own=await blob.text();const other=prompt('UID de la otra cuenta (opcional, debe haber creado su archivo de prueba).');let msg='Archivo propio: '+(own==='Prueba ficticia MicroHealth'?'correcto':'FALLO');if(other&&other!==user.id&&/^[0-9a-f-]{36}$/i.test(other)){const r=await bucket.download(other+'/beta-test.txt');msg+='\nLectura de archivo ajeno: '+(r.error?'rechazada':'FALLO');}say(msg);});
$('out').onclick=()=>run(async()=>{check(await client.auth.signOut());$('email').value='';say('Sesión cerrada.');});
</script></body></html>
